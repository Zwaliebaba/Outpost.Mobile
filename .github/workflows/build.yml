# Debug|x64 build and the four test suites, on every push and pull request.
#
# This is the first CI this repository has had. It gates: a red job means the branch does not
# build or a test failed, and nothing here is advisory. Two things it deliberately does not do
# yet, so that adding them later is a decision rather than an accident:
#
#   * Release|x64. Release only started being a real release build recently -- it was linking the
#     debug CRT and defining _DEBUG in all seven projects -- so there is no history of it being
#     green. Add the leg once it has been built by hand a few times (AGENTS.md 6).
#
# Both linters gate. clang-format runs in its own Linux job: it only reads C++ text, so putting it
# on a Windows runner would cost several times as much for the same answer. clang-tidy has to parse
# the code, so it runs on Windows after the build; it arrived non-blocking and was promoted on a
# clean run, which is how a linter should arrive. It gates over GameLogic and reports over
# NeuronServer, which is that same arrival happening again one project at a time.
#
# Runner notes, because these are the parts most likely to need adjusting on the first red run:
#
#   * The toolset is pinned and the runner has to carry it. Every project spells v145 and
#     stdcpplatest literally, per configuration, the way Visual Studio writes them (AGENTS.md 6),
#     which is the toolset windows-latest has today and the one a developer on VS 2026 uses. An
#     image without v145 would fail with MSB8020 rather than quietly compile something else, so the
#     image is a dependency. Leaving PlatformToolset empty is not the fallback it looks like:
#     Microsoft.Cpp.Default.props drops to v100 and the build stops with MSB8020 naming Visual
#     Studio 2010. Nothing in this tree may require C++23 to build.
#   * The projects use packages.config, not PackageReference, so restore is `nuget restore` per
#     config file rather than `msbuild -t:restore`. The list is walked from the tree so a project
#     added later is restored the day it lands.
#   * Outpost.slnx needs MSBuild 17.13 or newer; older msbuild does not read the .slnx format at
#     all. If a runner image ever regresses below that, build the .vcxproj files directly -- the
#     include paths are relative, so nothing but the output location depends on the solution.
#   * Shaders are compiled by DXC into headers under NeuronClient/CompiledShaders, which is build
#     output and not in source control -- DXC and not FXC because the projects ask for shader model
#     6.7, which FXC does not reach. Nothing extra is needed for that here; it falls out of the
#     project build.
#   * SolutionDir is passed explicitly. Without it every project writes its output beside itself
#     instead of into x64\Debug\, and the test paths below stop resolving.

name: Build

# push is limited to main because a branch with an open pull request would otherwise be built
# twice for the same commit -- once for the push and once for the merge ref -- and the two land in
# different concurrency groups, so neither cancels the other. Windows runners bill at several times
# the Linux rate, which makes a duplicate run worth one line of configuration.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's result irrelevant, and these are Windows
# runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # clang-format only reads C++ as text, so it needs no SDK, no toolset and no Windows. Twenty
  # seconds on Linux for the same answer a Windows runner would bill several times over.
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install clang-format
        # Pinned exactly. clang-format's output changes between releases, so an unpinned version
        # turns this job red on a day nobody touched the code.
        run: pip install clang-format==18.1.3

      - name: Check formatting
        run: python Build/CheckFormat.py

  debug-x64:
    name: Debug|x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2

      - name: Cache restored packages
        uses: actions/cache@v4
        with:
          path: packages
          key: packages-${{ hashFiles('**/packages.config') }}
          restore-keys: packages-

      - name: Check project files
        shell: pwsh
        # Before anything is compiled, because each of these fails at a point that names the
        # importer rather than the mistake. This step exists because a '--' in an XML comment cost
        # a CI run and reported as nine identical MSB4024 errors.
        run: python Build/CheckProjectFiles.py

      - name: Restore packages
        shell: pwsh
        run: |
          $configs = Get-ChildItem -Recurse -Filter packages.config |
                     Where-Object { $_.FullName -notlike '*\packages\*' }
          if (-not $configs) { throw 'no packages.config found -- has the tree moved?' }
          foreach ($config in $configs)
          {
            Write-Host "restoring $($config.FullName)"
            nuget restore $config.FullName -PackagesDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "restore failed for $($config.FullName)" }
          }

      - name: Build
        shell: pwsh
        run: |
          # AppxPackageSigningEnabled is off because there is no certificate in this repository and
          # CI is checking that the code compiles and links, not that a package can be signed.
          msbuild Outpost.slnx `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:SolutionDir="$($PWD.Path)\" `
            /p:AppxPackageSigningEnabled=false `
            /m `
            /v:minimal `
            /clp:Summary `
            /fl "/flp:LogFile=build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run tests
        shell: pwsh
        run: |
          # vstest.console lives inside the VS install rather than on PATH, and vswhere is the only
          # supported way to find that install.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -property installationPath
          $vstest = Join-Path $install 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
          if (-not (Test-Path $vstest)) { throw "vstest.console.exe not found at $vstest" }

          # Derived from the tree, not spelled here, so a suite added by a later slice runs the day
          # it lands rather than the day someone remembers this file.
          $suites = Get-ChildItem 'x64\Debug' -Filter '*Tests.dll' | ForEach-Object { $_.FullName }
          if (-not $suites) { throw 'no test suites were built -- x64\Debug is empty of *Tests.dll' }
          Write-Host "running: $($suites -join ', ')"

          & $vstest $suites /Platform:x64 /Logger:trx /ResultsDirectory:TestResults | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }

      - name: Run clang-tidy
        # GameLogic gates. It arrived non-blocking, came back clean on its second run once the header
        # filter stopped admitting generated C++/WinRT and two pre-existing files were fixed, and
        # was promoted -- which was the promise it made.
        #
        # A finding there is therefore yours: GameLogic was clean under LLVM 22 on this runner, so
        # anything new the step reports arrived with your change. The exception is a runner image
        # that brings a newer clang-tidy with checks that did not exist before; that is a real
        # possibility because the version is the VS-bundled one and not pinned. If a run goes red
        # on a day nobody touched GameLogic, compare the LLVM version line against the last green
        # run before assuming the code moved.
        #
        # NeuronServer joined it ADVISORY, and that is the point of this step's shape: the exit code
        # is GameLogic's count alone, so a finding in NeuronServer is printed and does not fail the
        # job. That is the tree's own rule for how a linter starts gating (AGENTS.md 6), and it is
        # not a formality here -- the runner's clang-tidy is the VS-bundled LLVM 22 while the sweep
        # that found NeuronServer clean was clang-tidy 18 on Linux, and .clang-tidy's own status
        # block records that the newer one has already seen a defect the older one did not. Two
        # green runs and promotion is one line: add NeuronServer's count to the exit.
        #
        # Why NeuronServer next: it is the smallest project, it is headless, and it is the only one
        # besides GameLogic that does not reach the D3D12 headers. Both still reach C++/WinRT through
        # NeuronCore.h, and that projection is generated during the build -- which is why this runs
        # after it, and why the generated directory is discovered rather than assumed.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -property installationPath
          $tidy = Join-Path $install 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          if (-not (Test-Path $tidy)) { Write-Host "clang-tidy not found at $tidy"; exit 1 }
          & $tidy --version

          # The C++/WinRT projection is generated per project; take whichever copies the build made.
          $generated = Get-ChildItem -Recurse -Directory -Filter 'winrt' -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -notlike '*\packages\*' } |
                       ForEach-Object { $_.Parent.FullName } | Select-Object -Unique
          Write-Host "generated projection directories: $($generated -join ', ')"

          # Import the developer environment so INCLUDE names the Windows SDK and the STL; clang's
          # cl driver reads it the same way cl.exe does.
          Import-Module (Join-Path $install 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation `
                           -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null

          # Walked rather than spelled twice, so the day a third project joins it is one entry in
          # this list. The file list inside each is read off disk for the same reason the test
          # suites are: a file added by a later slice is checked the day it lands.
          $counts = @{}
          foreach ($project in @('GameLogic', 'NeuronServer'))
          {
            $includes = @($project, 'NeuronCore') + $generated | ForEach-Object { "/I$_" }
            $failed = 0
            foreach ($source in Get-ChildItem $project -Filter *.cpp)
            {
              if ($source.Name -eq 'pch.cpp') { continue }
              Write-Host "--- $project/$($source.Name)"
              & $tidy --quiet $source.FullName -- --driver-mode=cl /std:c++20 /EHsc /D_DEBUG @includes
              if ($LASTEXITCODE -ne 0) { $failed++ }
            }
            $counts[$project] = $failed
            Write-Host "clang-tidy reported findings in $failed file(s) of $project"
          }

          # GameLogic alone decides the exit code; NeuronServer is advisory until two runs come back
          # clean and somebody promotes it, which is this line growing a `+ $counts['NeuronServer']`.
          exit $counts['GameLogic']

      - name: Upload logs
        # Failures are the case these are wanted in, and a green run's logs cost storage for
        # nothing -- but a red run whose log was not kept costs a second run to reproduce.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-x64-logs
          path: |
            build.log
            test.log
            TestResults/
          if-no-files-found: ignore
          retention-days: 14
