# Outpost server configuration.
#
# Read once at boot by the composition root and by nothing else: no library in this tree opens a
# file, and there is still no argv and no environment (AGENTS.md 5, ADR 0043).
#
# One `key = value` per line. `#` begins a comment and blank lines are ignored. Every key below is
# stated at its default, so this file and no file at all produce the same game -- which is what
# makes it safe to ship and safe to delete.
#
# Anything this reader does not understand is a refusal, not a shrug: an unknown key, a key twice, a
# missing `=`, a value that is not a number, or one outside the range named beside it. A refused
# file applies nothing and names the line, and this executable then boots on the defaults with
# CONFIG REFUSED in the event log.

# The port the server half listens on and the client half dials, on 127.0.0.1 only. 0 to 65535.
# Arbitrary and unregistered; since there is no fallback link (ADR 0028) a port already in use is
# the reason the game does not start, and the boot failure names it.
port = 30081

# Transports pre-allocated to hand accepted connections to -- the concurrency the listener carries,
# not a queue depth. At least 1. Slots are recycled as connections close (ADR 0031), so this is how
# many clients may be connected at once and not how many may ever connect.
backlog = 1

# What one subscriber is sent, and how much of its send rate it may convert into server work.
#
# The radius is metres and must be positive; the update period is in ticks and must be at least 1,
# so 6 at 60 Hz is ten updates a second. ordersPerTick is the ceiling on orders read from one
# subscriber in one tick -- over budget is queued and read next tick, never dropped.
interestRadiusMetres = 2000
interestUpdateEveryTicks = 6
ordersPerTick = 8
